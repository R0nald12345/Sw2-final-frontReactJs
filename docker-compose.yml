version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sw2-frontend
    ports:
      - "80:80"
      # - "443:443"  # Descomenta si usas HTTPS
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    # volumes:
    #   - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Para desarrollo
    #   - ./certs:/etc/nginx/certs:ro  # Para HTTPS (opcional)
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # depends_on:
    #   api:
    #     condition: service_healthy

